services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yamtrans}
      POSTGRES_USER: ${POSTGRES_USER:-yamtrans}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - yamtrans_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yamtrans} -d ${POSTGRES_DB:-yamtrans}"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-yamtrans}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yamtrans}
      TOKEN_SECRET: ${TOKEN_SECRET:-}
      SYNC_API_KEY: ${SYNC_API_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      COMPANY_NAME: ${COMPANY_NAME:-Yam-Trans}
      COMPANY_PHONE: ${COMPANY_PHONE:-+226 70 00 00 00}
      DEFAULT_COMPANY_CODE: ${DEFAULT_COMPANY_CODE:-YAMTRANS}
      DEFAULT_ADMIN_USER: ${DEFAULT_ADMIN_USER:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin123}
      PLATFORM_ADMIN_USER: ${PLATFORM_ADMIN_USER:-platform}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-ChangeMe-Platform-Admin!}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "127.0.0.1:${API_PORT:-8091}:8000"
volumes:
  yamtrans_pgdata:
